<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptGate AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        // crypto.randomUUID() exists only in secure contexts; provide it over plain HTTP.
        (function () {
            if (typeof crypto === "undefined") return;
            if (typeof crypto.randomUUID === "function") return;
            crypto.randomUUID = function () {
                var b = new Uint8Array(16);
                crypto.getRandomValues(b);
                b[6] = (b[6] & 0x0f) | 0x40; // version 4
                b[8] = (b[8] & 0x3f) | 0x80; // variant 10
                var h = Array.from(b, function (x) { return x.toString(16).padStart(2, "0"); }).join("");
                return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
            };
        })();
    </script>

    <script>
        const pathPrepend = "/" + (location.pathname.split("/")[1] || "");
        const cssLink = document.createElement('link');
        cssLink.rel = "stylesheet";
        cssLink.href = pathPrepend + "/css/style.css";
        document.head.appendChild(cssLink);

        const script = document.createElement('script');
        script.type = "module";
        script.src = pathPrepend + "/js/script.js";
        document.head.appendChild(script);

        const appScript = document.createElement('script');
        appScript.type = "module";
        appScript.src = pathPrepend + "/js/app.js";
        document.head.appendChild(appScript);
    </script>
    <style>
        /* light-magenta theme (overrides the palette in css/style.css) */
        html:root { --bg: #F9DDF4; --bg-panel: #FDF1FB; --nav-bg: #FDF1FB; --border: #EBC3E2;
                    --accent: #A12C8C; --accent-glow: #C95BB4; }
    </style>
</head>

<body>
    <nav>
        <div class="logo"><a href="" data-route="/">PromptGate AI</a></div>
        <div class="links">
            <a href="gateway">Prompt Study</a>
            <a href="detector">Live Detector</a>
            <a href="#" id="logout-link">Log out</a>
        </div>
    </nav>

    <main id="content">Loading...</main>

    <div id="overlay"></div>

    <footer>
        <p>© 2026 PromptGate AI · University of North Dakota research study</p>
    </footer>
    <script>
        // Log out: the site uses the browser's built-in login, which has no logout of its own.
        // Sending a request with throwaway credentials to /logout (always answers 401) makes the
        // browser drop the saved login; then return to the open home page.
        document.addEventListener("click", function (e) {
            var a = e.target.closest && e.target.closest("#logout-link");
            if (!a) return;
            e.preventDefault();
            var base = "/" + (location.pathname.split("/")[1] || "HOME");
            var done = function () { location.href = base + "/?loggedout=1"; };
            try {
                var x = new XMLHttpRequest();
                x.open("GET", base + "/logout", true, "logout", "x" + Date.now());
                x.onloadend = done; x.send();
                setTimeout(done, 2500);
            } catch (err) { done(); }
        });
        if (location.search.indexOf("loggedout=1") >= 0) {
            window.addEventListener("load", function () {
                var n = document.createElement("div");
                n.textContent = "You are logged out. Close this browser window to be certain.";
                n.style.cssText = "max-width:680px;margin:1rem auto 0;padding:.6rem 1rem;border-radius:8px;background:#fff;border:1px solid #EBC3E2;text-align:center";
                var m = document.getElementById("content"); m.parentNode.insertBefore(n, m);
            });
        }
    </script>
</body>

</html>
