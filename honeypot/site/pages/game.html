<head>
    <link rel="stylesheet" href="css/game.css" />
</head>

<div id="game-container">
    <div class="game-header">
        <h2>Tile Puzzle</h2>
        <p class="game-instructions">Click a tile next to the empty space to slide it. Arrange the tiles 1 through 5 in order to solve the puzzle.</p>
        <button id="shuffle-btn" class="shuffle-btn">Shuffle</button>
    </div>

    <div id="puzzle-board" class="puzzle-board">
        <!-- 6 tiles (5 numbered + 1 empty) rendered here -->
    </div>

    <p id="game-status" class="game-status"></p>
</div>
