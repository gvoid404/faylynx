<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found — PromptGate AI</title>
    <script type="module" src="js/script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #FFFFFF;
            color: #5B4E3F;
            font-family: "Work Sans", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 2rem;
        }

        h1 {
            font-family: "Source Serif 4", Georgia, serif;
            font-style: italic;
            font-weight: 600;
            font-size: 4rem;
            margin-bottom: 0.5rem;
            color: #B5502E;
        }

        p {
            font-size: 1.25rem;
            margin: 0.5rem 0 1.5rem;
        }

        a {
            display: inline-block;
            padding: 0.75rem 1.25rem;
            background-color: #B5502E;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        a:hover {
            background-color: #8F3F22;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>404</h1>
        <p>Oops! The page you’re looking for doesn’t exist.</p>
        <a href="/">Go Home</a>
